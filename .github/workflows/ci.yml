name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Python and dbt checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall ingestion ml

      - name: Create dbt CI profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<'EOF'
          football_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: football-analytics-ml
                dataset: football_dbt
                threads: 4
          EOF

      - name: Check dbt project parses
        working-directory: dbt_project
        run: dbt parse --profiles-dir "$RUNNER_TEMP/dbt_profiles"
