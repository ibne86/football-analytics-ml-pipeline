name: Full Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  run-pipeline:
    name: Fetch data, load BigQuery, and run dbt
    runs-on: ubuntu-latest

    env:
      FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      GCP_PROJECT_ID: football-analytics-ml
      BIGQUERY_RAW_DATASET: football_raw
      BIGQUERY_RAW_TABLE: raw_fixtures
      DBT_DATASET: football_dbt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Fetch football data
        run: python ingestion/fetch_data.py

      - name: Prepare BigQuery JSONL file
        run: python ingestion/prepare_bigquery_jsonl.py

      - name: Load raw fixtures to BigQuery
        run: python ingestion/load_bigquery.py

      - name: Create dbt profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt_profiles"
          cat > "$RUNNER_TEMP/dbt_profiles/profiles.yml" <<EOF
          football_analytics:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: ${GCP_PROJECT_ID}
                dataset: ${DBT_DATASET}
                threads: 4
          EOF

      - name: Run dbt models
        working-directory: dbt_project
        run: dbt run --profiles-dir "$RUNNER_TEMP/dbt_profiles"

      - name: Run dbt tests
        working-directory: dbt_project
        run: dbt test --profiles-dir "$RUNNER_TEMP/dbt_profiles"
