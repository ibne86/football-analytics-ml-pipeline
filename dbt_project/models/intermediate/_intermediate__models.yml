version: 2

models:
  - name: int_team_match_results
    description: "Intermediate model that converts each match into one row per team per match, making team-level aggregation easier."
    columns:
      - name: match_id
        description: "Unique identifier for the football match."

      - name: match_date
        description: "Calendar date of the match."

      - name: season
        description: "Football season of the match."

      - name: league_id
        description: "Unique identifier of the league."

      - name: league_name
        description: "Name of the football league."

      - name: team_id
        description: "Unique identifier of the team."

      - name: team_name
        description: "Name of the team."

      - name: home_away
        description: "Indicates whether the team played at home or away."

      - name: goals_for
        description: "Goals scored by the team in the match."

      - name: goals_against
        description: "Goals conceded by the team in the match."

      - name: win
        description: "Flag indicating whether the team won the match. 1 means win, 0 means not win."

      - name: draw
        description: "Flag indicating whether the team drew the match. 1 means draw, 0 means not draw."

      - name: loss
        description: "Flag indicating whether the team lost the match. 1 means loss, 0 means not loss."