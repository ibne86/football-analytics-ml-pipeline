version: 2

models:
  - name: match_results
    description: "Clean match-level mart table containing one row per completed football match, with goals, match result, winner, loser, and result flags."
    columns:
      - name: match_id
        description: "Unique identifier for each football match."
        tests:
          - not_null
          - unique

      - name: match_datetime
        description: "Full match date and time as a timestamp."

      - name: match_date
        description: "Calendar date of the match."
        tests:
          - not_null

      - name: league_id
        description: "Unique identifier of the league."

      - name: league_name
        description: "Name of the football league."

      - name: league_country
        description: "Country where the league is played."

      - name: season
        description: "Football season of the match."

      - name: match_round
        description: "League round or matchweek."

      - name: home_team_id
        description: "Unique identifier of the home team."

      - name: home_team
        description: "Name of the home team."
        tests:
          - not_null

      - name: away_team_id
        description: "Unique identifier of the away team."

      - name: away_team
        description: "Name of the away team."
        tests:
          - not_null

      - name: home_goals
        description: "Goals scored by the home team."
        tests:
          - not_null

      - name: away_goals
        description: "Goals scored by the away team."
        tests:
          - not_null

      - name: total_goals
        description: "Total goals scored in the match."

      - name: match_result
        description: "Derived match result: Home Win, Away Win, or Draw."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home Win', 'Away Win', 'Draw']

      - name: winning_team
        description: "Name of the winning team. If the match was a draw, this field contains Draw."

      - name: losing_team
        description: "Name of the losing team. If the match was a draw, this field contains Draw."

      - name: is_home_win
        description: "Numeric flag where 1 means the home team won and 0 means otherwise."

      - name: is_away_win
        description: "Numeric flag where 1 means the away team won and 0 means otherwise."

      - name: is_draw
        description: "Numeric flag where 1 means the match ended in a draw and 0 means otherwise."

      - name: venue_name
        description: "Name of the stadium or venue."

      - name: venue_city
        description: "City where the match was played."

      - name: match_status
        description: "Full match status."

      - name: match_status_short
        description: "Short match status code."

  - name: team_performance
    description: "Team-level mart table summarizing season performance by team, including matches played, wins, draws, losses, goals, goal difference, and points."
    columns:
      - name: season
        description: "Football season."

      - name: league_id
        description: "Unique identifier of the league."

      - name: league_name
        description: "Name of the football league."

      - name: team_id
        description: "Unique identifier of the team."
        tests:
          - not_null

      - name: team_name
        description: "Name of the team."
        tests:
          - not_null

      - name: matches_played
        description: "Total number of completed matches played by the team."
        tests:
          - not_null

      - name: wins
        description: "Total number of matches won by the team."
        tests:
          - not_null

      - name: draws
        description: "Total number of matches drawn by the team."
        tests:
          - not_null

      - name: losses
        description: "Total number of matches lost by the team."
        tests:
          - not_null

      - name: goals_for
        description: "Total goals scored by the team."

      - name: goals_against
        description: "Total goals conceded by the team."

      - name: goal_difference
        description: "Goals scored minus goals conceded."

      - name: points
        description: "Total points calculated as wins multiplied by 3 plus draws multiplied by 1."
        tests:
          - not_null

  - name: home_away_performance
    description: "Team-level mart table comparing each team's home and away performance using matches played, wins, draws, losses, goals, points, and win rate."
    columns:
      - name: season
        description: "Football season."

      - name: league_id
        description: "Unique identifier of the league."

      - name: league_name
        description: "Name of the football league."

      - name: team_id
        description: "Unique identifier of the team."
        tests:
          - not_null

      - name: team_name
        description: "Name of the team."
        tests:
          - not_null

      - name: home_away
        description: "Indicates whether the performance row is for home matches or away matches."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away']

      - name: matches_played
        description: "Number of matches played at home or away."
        tests:
          - not_null

      - name: wins
        description: "Number of wins at home or away."
        tests:
          - not_null

      - name: draws
        description: "Number of draws at home or away."
        tests:
          - not_null

      - name: losses
        description: "Number of losses at home or away."
        tests:
          - not_null

      - name: goals_for
        description: "Goals scored at home or away."

      - name: goals_against
        description: "Goals conceded at home or away."

      - name: goal_difference
        description: "Goals scored minus goals conceded for home or away matches."

      - name: points
        description: "Points earned at home or away."
        tests:
          - not_null

      - name: win_rate
        description: "Win rate calculated as wins divided by matches played."
        tests:
          - not_null

      - name: avg_goals_for
        description: "Average goals scored per home or away match."

      - name: avg_goals_against
        description: "Average goals conceded per home or away match."

  - name: season_summary
    description: "Season-level mart table containing dashboard KPI metrics such as total matches, total goals, home wins, away wins, draws, and average goals per match."
    columns:
      - name: season
        description: "Football season."
        tests:
          - not_null

      - name: league_id
        description: "Unique identifier of the league."
        tests:
          - not_null

      - name: league_name
        description: "Name of the football league."
        tests:
          - not_null

      - name: league_country
        description: "Country where the league is played."

      - name: total_matches
        description: "Total number of completed matches in the season."
        tests:
          - not_null

      - name: total_goals
        description: "Total number of goals scored in the season."
        tests:
          - not_null

      - name: home_wins
        description: "Total number of matches won by home teams."
        tests:
          - not_null

      - name: away_wins
        description: "Total number of matches won by away teams."
        tests:
          - not_null

      - name: draws
        description: "Total number of drawn matches."
        tests:
          - not_null

      - name: avg_goals_per_match
        description: "Average number of goals scored per match."
        tests:
          - not_null
          
  - name: ml_match_features
    description: "ML-ready mart table with one row per completed match, containing match details, the prediction target, goals, result labels, and outcome flags for future machine learning."
    columns:
      - name: match_id
        description: "Unique identifier for each match."
        tests:
          - not_null
          - unique

      - name: season
        description: "Football season."
        tests:
          - not_null

      - name: league_id
        description: "Unique identifier of the league."
        tests:
          - not_null

      - name: league_name
        description: "Name of the football league."
        tests:
          - not_null

      - name: match_date
        description: "Date of the match."
        tests:
          - not_null

      - name: home_team_id
        description: "Unique identifier of the home team."
        tests:
          - not_null

      - name: home_team
        description: "Name of the home team."
        tests:
          - not_null

      - name: away_team_id
        description: "Unique identifier of the away team."
        tests:
          - not_null

      - name: away_team
        description: "Name of the away team."
        tests:
          - not_null

      - name: home_goals
        description: "Goals scored by the home team. This is an outcome/reference column and should not be used as an input feature for pre-match prediction."
        tests:
          - not_null

      - name: away_goals
        description: "Goals scored by the away team. This is an outcome/reference column and should not be used as an input feature for pre-match prediction."
        tests:
          - not_null

      - name: total_goals
        description: "Total goals scored in the match. This is an outcome/reference column and should not be used as an input feature for pre-match prediction."
        tests:
          - not_null

      - name: match_result
        description: "Final match result: Home Win, Away Win, or Draw. This is kept as an outcome/reference column."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home Win', 'Away Win', 'Draw']

      - name: target_match_result
        description: "Prediction target for future match-result models. Expected values are Home Win, Away Win, or Draw."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home Win', 'Away Win', 'Draw']

      - name: is_home_win
        description: "Flag showing whether the home team won the match. This is an outcome/reference column and should not be used as an input feature for pre-match prediction."
        tests:
          - not_null

      - name: is_away_win
        description: "Flag showing whether the away team won the match. This is an outcome/reference column and should not be used as an input feature for pre-match prediction."
        tests:
          - not_null

      - name: is_draw
        description: "Flag showing whether the match ended in a draw. This is an outcome/reference column and should not be used as an input feature for pre-match prediction."
        tests:
          - not_null
